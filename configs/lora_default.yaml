# M2 default LoRA run — matches the assignment's suggested defaults.
name: lora-default-r16-lr2e4
technique: lora
notes: |
  M2 first LoRA fine-tune. Sensible defaults, single epoch, no sweep.
  Acceptance: trains without OOM, loss decreases monotonically after warmup.

  Batch sizing note (2026-06-12):
  Per-device batch is 1 (not 2 or 4) because UNSLOTH_RETURN_LOGITS=1 forces
  the full [batch x seq x vocab] logits tensor to be materialized, and on
  T4 (fp16 autocast) accelerate then upcasts it to fp32 — doubling memory.
  Per-device 1 + grad-accum 8 gives the same effective batch as the
  original setting (1 x 8 = 8) while staying inside T4's VRAM budget.

model:
  base_model: unsloth/gemma-4-E2B-it
  max_seq_length: 2048
  load_in_4bit: false
  full_finetuning: false

lora:
  r: 16
  lora_alpha: 16
  lora_dropout: 0.0
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  use_gradient_checkpointing: unsloth
  random_state: 3407

data:
  dataset_name: FreedomIntelligence/medical-o1-reasoning-SFT
  split: train
  test_size: 500
  val_size: 500
  seed: 3407

training:
  learning_rate: 2.0e-4
  per_device_train_batch_size: 1     # was 2 — see batch sizing note above
  per_device_eval_batch_size: 1      # match train, otherwise default 8 OOMs at eval
  gradient_accumulation_steps: 8     # was 4 — compensate to keep effective batch=8
  num_train_epochs: 1.0
  warmup_ratio: 0.05
  weight_decay: 0.01
  lr_scheduler_type: cosine
  eval_steps: 100
  save_steps: 200
  save_total_limit: 3
  logging_steps: 10
  sample_print_steps: 100
  seed: 3407

early_stopping:
  enabled: true
  early_stopping_patience: 3
  early_stopping_threshold: 0.005