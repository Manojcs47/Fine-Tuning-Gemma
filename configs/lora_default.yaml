# M2 default LoRA run — matches the assignment's suggested defaults.
name: lora-default-r16-lr2e4
technique: lora
notes: |
  M2 first LoRA fine-tune. Sensible defaults, single epoch, no sweep.
  Acceptance: trains without OOM, loss decreases monotonically after warmup.

  Context length note (2026-06-16):
  max_seq_length is 1024 (was briefly dropped to 768). Earlier the run forced
  Unsloth to materialize the full [B, S, 262144] logits tensor (via
  UNSLOTH_RETURN_LOGITS=1), which at any length above ~768 sat at the T4 VRAM
  ceiling and OOM'd within ~10 steps. That env var has been removed: loss is
  now computed through Unsloth's fused, logit-free cross-entropy (see
  gemma_medical.train._MemoryEfficientSFTTrainer), which frees ~3 GB of
  steady-state VRAM. 1024 fits comfortably and captures the long medical CoT
  answers more faithfully; the rare longer example is truncated cleanly.

  Batch sizing: per_device=1 + grad_accum=8 → effective batch 8.

model:
  base_model: unsloth/gemma-4-E2B-it
  max_seq_length: 1024              # restored from 768 — see note above
  load_in_4bit: false
  full_finetuning: false

lora:
  r: 16
  lora_alpha: 16
  lora_dropout: 0.0
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  use_gradient_checkpointing: unsloth
  random_state: 3407

data:
  dataset_name: FreedomIntelligence/medical-o1-reasoning-SFT
  split: train
  test_size: 500
  val_size: 500
  seed: 3407

training:
  learning_rate: 2.0e-4
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  num_train_epochs: 1.0
  warmup_ratio: 0.05
  weight_decay: 0.01
  lr_scheduler_type: cosine
  eval_steps: 100
  save_steps: 200
  save_total_limit: 3
  logging_steps: 10
  sample_print_steps: 100
  eval_dataset_size: 100
  eval_accumulation_steps: 1
  disable_intraining_eval: false
  seed: 3407

early_stopping:
  enabled: true
  early_stopping_patience: 3
  early_stopping_threshold: 0.005

evaluation:
  n_predictions: 200
  n_judge_samples: 50
  n_qualitative_samples: 10
  perplexity_samples: 100
  max_new_tokens: 1024
  do_sample: false
  batch_size: 4
  judge_model: unsloth/gemma-4-E2B-it
  judge_max_new_tokens: 256
  reuse_inference_model_as_judge: true