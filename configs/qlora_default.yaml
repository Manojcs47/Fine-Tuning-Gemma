# M4 QLoRA run — same hyperparameters as the LoRA default, only quantization differs.
name: qlora-default-r16-lr2e4
technique: qlora
notes: |
  M4 QLoRA comparison. Identical to lora_default.yaml except 4-bit quantization.
  Used to quantify the quality/memory trade-off of 4-bit.

model:
  base_model: unsloth/gemma-4-E2B-it
  max_seq_length: 2048
  load_in_4bit: true       # only difference vs LoRA default
  full_finetuning: false

lora:
  r: 16
  lora_alpha: 16
  lora_dropout: 0.0
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  use_gradient_checkpointing: unsloth
  random_state: 3407

data:
  dataset_name: FreedomIntelligence/medical-o1-reasoning-SFT
  split: train
  test_size: 500
  val_size: 500
  seed: 3407

training:
  learning_rate: 2.0e-4
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  num_train_epochs: 1.0
  warmup_ratio: 0.05
  weight_decay: 0.01
  lr_scheduler_type: cosine
  eval_steps: 100
  save_steps: 200
  save_total_limit: 3
  logging_steps: 10
  sample_print_steps: 100
  seed: 3407

early_stopping:
  enabled: true
  early_stopping_patience: 3
  early_stopping_threshold: 0.005