# M4 QLoRA run — same hyperparameters as the LoRA default, only quantization differs.
name: qlora-default-r16-lr2e4
technique: qlora
notes: |
  M4 QLoRA comparison. Identical to lora_default.yaml in optimizer settings;
  the differences are 4-bit base weights and (because that frees memory)
  max_seq_length restored to 2048.

  Batch sizing matches lora_default.yaml — effective batch=8 both ways for
  a clean comparison.

model:
  base_model: unsloth/gemma-4-E2B-it
  max_seq_length: 2048              # QLoRA has headroom (4-bit base ~2.5 GB)
  load_in_4bit: true                # only weight change vs LoRA default
  full_finetuning: false

lora:
  r: 16
  lora_alpha: 16
  lora_dropout: 0.0
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  use_gradient_checkpointing: unsloth
  random_state: 3407

data:
  dataset_name: FreedomIntelligence/medical-o1-reasoning-SFT
  split: train
  test_size: 500
  val_size: 500
  seed: 3407

training:
  learning_rate: 2.0e-4
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  num_train_epochs: 1.0
  warmup_ratio: 0.05
  weight_decay: 0.01
  lr_scheduler_type: cosine
  eval_steps: 100
  save_steps: 200
  save_total_limit: 3
  logging_steps: 10
  sample_print_steps: 100
  eval_dataset_size: 100
  eval_accumulation_steps: 1
  disable_intraining_eval: false
  seed: 3407

early_stopping:
  enabled: true
  early_stopping_patience: 3
  early_stopping_threshold: 0.005

evaluation:
  n_predictions: 200
  n_judge_samples: 50
  n_qualitative_samples: 10
  perplexity_samples: 100
  max_new_tokens: 1024
  do_sample: false
  batch_size: 4
  judge_model: unsloth/gemma-4-E2B-it
  judge_max_new_tokens: 256
  reuse_inference_model_as_judge: true