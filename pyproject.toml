[project]
name = "gemma-medical"
version = "0.1.0"
description = "Fine-tuning Gemma 4 E2B for medical reasoning (Week 3 assignment)"
authors = [{ name = "Manoj" }]
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"